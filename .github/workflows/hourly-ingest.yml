name: Hourly TVL Ingest

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:     # manual trigger (optional)

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run ingest
        run: |
          curl -H "Authorization: Bearer $CRON_SECRET" \ https://audit-score.vercel.app/api/ingest/defillama
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
