name: Hourly TVL Ingest

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingest API
        run: |
          curl -f -H "Authorization: Bearer $CRON_SECRET" https://auditscore.vercel.app/api/ingest/defillama
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
